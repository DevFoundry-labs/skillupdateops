[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skillupdateops"
version = "1.0.0"
description = "Dependabot-style lifecycle management for AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DevFoundry Labs" }]
keywords = ["ai-agents", "skills", "supply-chain", "security", "devsecops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12.20250516",
]

[project.scripts]
skillops = "skillupdateops.cli:main"

[project.urls]
Homepage = "https://github.com/DevFoundry-labs/skillupdateops"
Documentation = "https://github.com/DevFoundry-labs/skillupdateops#readme"
Issues = "https://github.com/DevFoundry-labs/skillupdateops/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skillupdateops"]

[tool.pytest.ini_options]
addopts = "--strict-markers --basetemp=.pytest-tmp --cov=skillupdateops --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["skillupdateops"]
